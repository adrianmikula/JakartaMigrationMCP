# ============================================================================
# Audit Upsell Configuration
# Controls the Migration Risk Audit CTA behavior.
# ============================================================================

# Landing page opened when any CTA is clicked.
audit.landing.page.url=https://codemedicconsulting.netlify.app/?panel=services&item=jakarta-migration

# Prominent bottom bar copy
audit.cta.title=Need help with this migration?
audit.cta.subtitle=Need expert help? Request a Migration Risk Audit.
audit.cta.button.text=Get a Risk Audit

# In-scan notification/balloon
audit.inscan.title=Migration too complex to automate?
audit.inscan.message=This project has patterns the plugin cannot fully migrate automatically. Explore a manual Migration Risk Audit.

# Risk tab warning box messages (use %d where a number is substituted)
audit.warning.title=This project is too complex to fully automate.
audit.warning.intro=The following thresholds were exceeded:
audit.warning.complexity.text=Complexity is %d (above the threshold).
audit.warning.risk.text=Risk is %d (above the threshold).
audit.warning.automation.text=Automation is %d (below the threshold).

# Dial-based CTA thresholds. The CTA is shown when ANY of these is true:
#  - Complexity score is >= complexity.high.threshold
#  - Risk score is >= risk.high.threshold
#  - Automation level is <= automation.low.threshold
audit.dial.complexity.high.threshold=70
audit.dial.risk.high.threshold=70
audit.dial.automation.low.threshold=30
