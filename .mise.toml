# mise-en-place (mise) configuration
# Tool version management and project setup
# Install mise: https://mise.jdx.dev/getting-started.html
#
# ─── AGENT ITERATION CHEAT SHEET ──────────────────────────────────────────────
# Fastest feedback loop (all under 1.5s):
#   ./gradlew :community-core-engine:compileJava              (~0.8s)
#   ./gradlew :community-core-engine:fastTest                 (~0.76s)
#   ./gradlew :community-core-engine:fastTest :premium-core-engine:fastTest :premium-experiment-engine:fastTest --configure-on-demand  (~1.3s)
#
# Do NOT use:
#   ./gradlew :community-mcp-server:fastTest    (broken transitive deps)
#   ./gradlew :premium-mcp-server:fastTest      (broken transitive deps)
#
# See AGENTS.md and COMMANDS.md for full details.
# ───────────────────────────────────────────────────────────────────────────────

[tools]
java = "zulu-21-crac"
gradle = "8.5"
node = "20.11.0"

[env]
JAVA_HOME = "/usr/lib/jvm/zulu-21-crac-amd64"
DB_USERNAME = "postgres"
DB_PASSWORD = "postgres"
REDIS_HOST = "localhost"
REDIS_PORT = "6379"
OLLAMA_BASE_URL = "http://localhost:11434"
OLLAMA_MODEL = "deepseek-coder:6.7b"
REPO_CLONE_PATH = "./repos"

# ─── SDLC Stage Tasks ────────────────────────────────────────────────────────

# 1. SETUP

[tasks.setup]
description = "Project setup - see scripts/setup.sh (Linux/Mac) or scripts/setup.ps1 (Windows)"
run = "echo 'Please run: ./scripts/setup.ps1 (Windows) or ./scripts/setup.sh (Linux/Mac)'"

[tasks.start-services]
description = "Start Docker services (PostgreSQL and Redis)"
run_windows = "powershell -File scripts/start-services.ps1"
run = "bash scripts/start-services.sh"

[tasks.stop-services]
description = "Stop Docker services"
run_windows = "powershell -File scripts/stop-services.ps1"
run = "bash scripts/stop-services.sh"

# 2. BUILD (compile only, no tests)

[tasks.build]
description = "Compile all modules"
run_windows = "gradlew.bat :community-core-engine:compileJava :community-mcp-server:compileJava :premium-core-engine:compileJava :premium-mcp-server:compileJava :premium-experiment-engine:compileJava"
run = "gradle :community-core-engine:compileJava :community-mcp-server:compileJava :premium-core-engine:compileJava :premium-mcp-server:compileJava :premium-experiment-engine:compileJava"

[tasks.clean]
description = "Clean all build artifacts"
run_windows = "gradlew.bat clean"
run = "gradle clean"

# 3. TEST

[tasks.test]
description = "Run all module tests"
run_windows = "gradlew.bat test -Djakarta.migration.mode=dev"
run = "gradle test -Djakarta.migration.mode=dev --no-configuration-cache"

# NOTE: fast-test targets only community-core-engine and premium-core-engine.
# community-mcp-server and premium-mcp-server have broken transitive deps
# (spring-boot-devtools missing version) that cause configuration cache failures.
# --configure-on-demand skips configuring unused projects for faster startup.
# NOTE: fast-test targets community-core-engine, premium-core-engine, and premium-experiment-engine.
# community-mcp-server and premium-mcp-server have broken transitive deps
# (spring-boot-devtools missing version) that cause configuration cache failures.
# --configure-on-demand skips configuring unused projects for faster startup.
[tasks.fast-test]
description = "Run fast tests only (excludes @Tag(slow)) - ~1.3s"
run_windows = "gradlew.bat :community-core-engine:fastTest :premium-core-engine:fastTest :premium-experiment-engine:fastTest --configure-on-demand -Djakarta.migration.mode=dev"
run = "gradle :community-core-engine:fastTest :premium-core-engine:fastTest :premium-experiment-engine:fastTest --configure-on-demand -Djakarta.migration.mode=dev"

[tasks.coverage]
description = "Generate JaCoCo test coverage report"
run_windows = "gradlew.bat jacocoTestReport -Djakarta.migration.mode=dev"
run = "gradle jacocoTestReport -Djakarta.migration.mode=dev"

# 4. PACKAGE / RELEASE

[tasks.assembly]
description = "Build fat JAR for community MCP server (release artifact)"
run_windows = "gradlew.bat :community-mcp-server:bootJar"
run = "gradle :community-mcp-server:bootJar"

[tasks.build-plugin-zip]
description = "Build IntelliJ plugin distribution ZIP (release artifact)"
run_windows = "gradlew.bat :premium-intellij-plugin:buildPlugin --no-configuration-cache"
run = "gradle :premium-intellij-plugin:buildPlugin --no-configuration-cache"

[tasks.verify-plugin]
description = "Verify plugin binary compatibility against IntelliJ 2024.3, 2025.1.1 (strict mode)"
run_windows = "gradlew.bat :premium-intellij-plugin:buildPlugin :premium-intellij-plugin:runPluginVerifier --no-configuration-cache"
run = "gradle :premium-intellij-plugin:buildPlugin :premium-intellij-plugin:runPluginVerifier --no-configuration-cache"

# 5. RUN / DEV

[tasks.run]
description = "Run the community MCP server"
run_windows = "gradlew.bat :community-mcp-server:bootRun"
run = "gradle :community-mcp-server:bootRun"

[tasks.run-ide]
description = "Run IntelliJ IDE with plugin loaded (dev mode, skips licensing)"
run_windows = "gradlew.bat :premium-intellij-plugin:runIdeDev"
run = "gradle :premium-intellij-plugin:runIdeDev"

[tasks.run-ide-demo]
description = "Run IntelliJ IDE with plugin in demo marketplace mode"
run_windows = "gradlew.bat :premium-intellij-plugin:runIdeDemo"
run = "gradle :premium-intellij-plugin:runIdeDemo"

# 6. DOCKER

[tasks.docker-logs]
description = "Follow Docker service logs"
run = "docker compose logs -f"

[tasks.docker-ps]
description = "Check Docker service status"
run = "docker compose ps"

[tasks.health]
description = "Check MCP server health endpoint"
run = "curl http://localhost:8080/actuator/health"

# 7. CRaC (Coordinated Restore at Checkpoint)

[tasks.crac-start]
description = "Start MCP server with CRaC checkpoint enabled"
run = "JAVA_HOME=/usr/lib/jvm/zulu-21-crac-amd64 java -XX:CRaCCheckpointTo=/tmp/crac-checkpoint -jar community-mcp-server/build/libs/jakarta-migration-mcp.jar"

[tasks.crac-checkpoint]
description = "Trigger CRaC checkpoint on running server"
run = "jcmd $(jcmd -l | grep jakarta-migration | cut -d' ' -f1) JDK.checkpoint"

[tasks.crac-restore]
description = "Restore from CRaC checkpoint"
run = "JAVA_HOME=/usr/lib/jvm/zulu-21-crac-amd64 java -XX:CRaCRestoreFrom=/tmp/crac-checkpoint"
