name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run fast tests (all modules)
        run: ./gradlew :community-core-engine:fastTest :community-mcp-server:fastTest :premium-core-engine:fastTest :premium-experiment-engine:fastTest :premium-mcp-server:fastTest --configure-on-demand

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache IntelliJ IDEA
        id: cache-idea-unit
        uses: actions/cache@v4
        with:
          path: ~/idea
          key: intellij-ideaIC-2024.3-${{ runner.os }}
          restore-keys: |
            intellij-ideaIC-2024.3-${{ runner.os }}

      - name: Download IntelliJ IDEA
        if: steps.cache-idea-unit.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/idea
          curl -L --retry 3 --retry-delay 5 "https://download.jetbrains.com/idea/ideaIC-2024.3.tar.gz" | tar -xz -C ~/idea --strip-components=1

      - name: Set IDEA_HOME
        run: echo "IDEA_HOME=${{ runner.home }}/idea" >> $GITHUB_ENV

      - name: Run unit tests
        run: ./gradlew test

      - name: Generate coverage reports
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache IntelliJ IDEA
        id: cache-idea-perf
        uses: actions/cache@v4
        with:
          path: ~/idea
          key: intellij-ideaIC-2024.3-${{ runner.os }}
          restore-keys: |
            intellij-ideaIC-2024.3-${{ runner.os }}

      - name: Download IntelliJ IDEA
        if: steps.cache-idea-perf.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/idea
          curl -L --retry 3 --retry-delay 5 "https://download.jetbrains.com/idea/ideaIC-2024.3.tar.gz" | tar -xz -C ~/idea --strip-components=1

      - name: Set IDEA_HOME
        run: echo "IDEA_HOME=${{ runner.home }}/idea" >> $GITHUB_ENV

      - name: Run performance/slow tests
        run: ./gradlew :premium-core-engine:slowTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  semgrep-analysis:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          sarif: true
          publish: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  infer-analysis:
    name: Infer Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Infer
        run: |
          curl -sSL "https://github.com/facebook/infer/releases/download/v1.1.0/infer-linux64-v1.1.0.tar.xz" | tar -C /tmp -xJ
          sudo mv /tmp/infer-linux64 /opt/infer
          sudo ln -sf /opt/infer/bin/infer /usr/local/bin/infer

      - name: Run Infer
        run: |
          infer --version
          infer run -- javac $(find . -name "*.java" -path "*/src/main/java/*")

      - name: Upload Infer results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infer-results
          path: infer-out/
          retention-days: 7
          if-no-files-found: ignore

  release-tests:
    name: Release Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache IntelliJ IDEA
        id: cache-idea-release
        uses: actions/cache@v4
        with:
          path: ~/idea
          key: intellij-ideaIC-2024.3-${{ runner.os }}
          restore-keys: |
            intellij-ideaIC-2024.3-${{ runner.os }}

      - name: Download IntelliJ IDEA
        if: steps.cache-idea-release.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/idea
          curl -L --retry 3 --retry-delay 5 "https://download.jetbrains.com/idea/ideaIC-2024.3.tar.gz" | tar -xz -C ~/idea --strip-components=1

      - name: Set IDEA_HOME
        run: echo "IDEA_HOME=${{ runner.home }}/idea" >> $GITHUB_ENV

      - name: Run module boundary validation
        run: ./gradlew validateModuleBoundaries

      - name: Run all validation checks
        run: ./gradlew validateAllWithBuildTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [fast-tests, unit-tests, performance-tests, security-tests, semgrep-analysis, infer-analysis, release-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache IntelliJ IDEA
        id: cache-idea-build
        uses: actions/cache@v4
        with:
          path: ~/idea
          key: intellij-ideaIC-2024.3-${{ runner.os }}
          restore-keys: |
            intellij-ideaIC-2024.3-${{ runner.os }}

      - name: Download IntelliJ IDEA
        if: steps.cache-idea-build.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/idea
          curl -L --retry 3 --retry-delay 5 "https://download.jetbrains.com/idea/ideaIC-2024.3.tar.gz" | tar -xz -C ~/idea --strip-components=1

      - name: Set IDEA_HOME
        run: echo "IDEA_HOME=${{ runner.home }}/idea" >> $GITHUB_ENV

      - name: Build all modules
        run: ./gradlew build -x test

      - name: Build MCP server
        run: ./gradlew :community-mcp-server:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/
            **/build/distributions/
          retention-days: 7
          if-no-files-found: ignore
