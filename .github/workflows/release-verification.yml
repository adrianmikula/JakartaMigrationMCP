name: Release Verification

# This workflow runs the IntelliJ Plugin Verifier against IC-2024.3 and IC-2025.1.1
# It runs on pull requests and can be triggered manually for release preparation
# This ensures API compatibility warnings are caught before Marketplace upload

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running release verification'
        required: true
        default: 'Pre-release compatibility check'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  verify-plugin-compatibility:
    name: Verify Plugin Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew :premium-intellij-plugin:buildPlugin --no-configuration-cache

      - name: Run Plugin Verifier
        run: ./gradlew :premium-intellij-plugin:runPluginVerifier --no-configuration-cache

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verification-reports
          path: |
            premium-intellij-plugin/build/reports/pluginVerifier/
          retention-days: 30
          if-no-files-found: warn

      - name: Check verification results
        if: failure()
        run: |
          echo "::error::Plugin verification failed! Check the uploaded artifacts for compatibility issues."
          echo "::error::Review the HTML/TXT reports in premium-intellij-plugin/build/reports/pluginVerifier/"
          exit 1
