name: Bug Report
description: Report a bug in Jakarta Migration
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: Which version of the Jakarta Migration plugin are you using?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: ide
    attributes:
      label: IDE
      description: Which IDE are you using?
      options:
        - IntelliJ IDEA
        - WebStorm
        - PhpStorm
        - Other
    validations:
      required: true

  - type: input
    id: ide-version
    attributes:
      label: IDE Version
      description: e.g. 2024.3.1
      placeholder: "2024.3.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output here.
      render: shell
